<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="orbit-bg" x1="30" y1="18" x2="225" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d4ed8" />
      <stop offset=".55" stop-color="#0891b2" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="orbit-glow" cx="128" cy="112" r="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbit-planet" cx=".36" cy=".28" r=".95">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".52" stop-color="#bae6fd" />
      <stop offset="1" stop-color="#3b82f6" />
    </radialGradient>
    <radialGradient id="orbit-planet-shade" cx=".34" cy=".3" r="1">
      <stop offset="0" stop-color="#172554" stop-opacity="0" />
      <stop offset=".78" stop-color="#172554" stop-opacity="0" />
      <stop offset="1" stop-color="#172554" stop-opacity=".42" />
    </radialGradient>
    <linearGradient id="orbit-ring" x1="26" y1="170" x2="230" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdba74" />
      <stop offset=".45" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#a5f3fc" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="64" fill="url(#orbit-bg)" />
  <rect width="256" height="256" rx="64" fill="url(#orbit-glow)" />
  <!-- ring behind the planet -->
  <path d="M 183.6 134.2 A 104 32 -24 1 0 95.4 173.5" fill="none" stroke="url(#orbit-ring)" stroke-width="13" opacity=".42" />
  <circle cx="128" cy="128" r="56" fill="url(#orbit-planet)" />
  <circle cx="128" cy="128" r="56" fill="url(#orbit-planet-shade)" />
  <circle cx="106" cy="104" r="9" fill="#ffffff" opacity=".78" />
  <!-- ring passing in front of the planet -->
  <path d="M 183.6 134.2 A 104 32 -24 0 1 95.4 173.5" fill="none" stroke="url(#orbit-ring)" stroke-width="14" stroke-linecap="round" />
  <circle cx="187" cy="79" r="10" fill="#f97316" />
</svg>
