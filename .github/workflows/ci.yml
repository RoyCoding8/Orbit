name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Test frontend
        run: npm test
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Test Rust
        run: |
          cargo test --manifest-path orbit-core/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

  formal:
    name: formal (Kani and TLC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check core and harness formatting
        run: |
          cargo fmt --manifest-path orbit-core/Cargo.toml --check
          cargo fmt --manifest-path formal/Cargo.toml --check
          cargo clippy --manifest-path formal/Cargo.toml -- -D warnings
      - name: Check journal safety and liveness
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "$RUNNER_TEMP/tla2tools.jar"
          bash formal/run-tlc.sh "$RUNNER_TEMP/tla2tools.jar"
      - name: Check core safety
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
          bash formal/run.sh

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [checks, formal]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run tauri build
