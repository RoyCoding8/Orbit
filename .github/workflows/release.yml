name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-packages:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: windows-arm64
            runner: windows-latest
            rust-target: aarch64-pc-windows-msvc
            bundles: nsis
          - label: linux-x64
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - label: linux-arm64
            runner: ubuntu-latest
            rust-target: aarch64-unknown-linux-gnu
            bundles: deb
          - label: macos-arm64
            runner: macos-latest
            rust-target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macos-x64
            runner: macos-latest
            rust-target: x86_64-apple-darwin
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf
      - name: Set up Linux ARM64 cross toolchain
        if: matrix.rust-target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          sudo tee /etc/apt/sources.list.d/arm64.list > /dev/null <<EOF
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $CODENAME main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $CODENAME-updates main restricted universe multiverse
          EOF
          sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            libxdo-dev:arm64 \
            libssl-dev:arm64 \
            librsvg2-dev:arm64
      - name: Configure Linux ARM64 cross toolchain
        if: matrix.rust-target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build packages
        run: npm run tauri build -- --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }}
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  draft-release:
    name: draft release
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: Orbit v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          draft: true
          prerelease: true
          files: release-assets/**
          fail_on_unmatched_files: true
