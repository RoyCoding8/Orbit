name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark GitHub Release as a prerelease
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-packages:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: windows-arm64
            runner: windows-latest
            rust-target: aarch64-pc-windows-msvc
            bundles: nsis
          - label: linux-x64
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            bundles: deb
          - label: macos-arm64
            runner: macos-latest
            rust-target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macos-x64
            runner: macos-latest
            rust-target: x86_64-apple-darwin
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci
      - name: Build packages
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npm run tauri build -- --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }}
          else
            npm run tauri build -- --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe.sig
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  draft-release:
    name: draft release
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: version
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Prepare release assets, latest.json, and SHA256SUMS.txt
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import datetime
          import hashlib
          import json
          import os
          import shutil
          import urllib.parse
          from pathlib import Path

          version = os.environ["APP_VERSION"]
          repo = os.environ["REPO"]
          src_root = Path("release-assets")
          out_dir = Path("release-upload")
          out_dir.mkdir(parents=True, exist_ok=True)

          platform_map = {
              "windows-x64": ("windows-x86_64", ".exe", None),
              "windows-arm64": ("windows-aarch64", ".exe", None),
              "linux-x64": ("linux-x86_64", ".AppImage", None),
              "macos-arm64": ("darwin-aarch64", ".app.tar.gz", f"Orbit_{version}_aarch64.app.tar.gz"),
              "macos-x64": ("darwin-x86_64", ".app.tar.gz", f"Orbit_{version}_x64.app.tar.gz"),
          }

          platforms = {}

          for label_dir in sorted(src_root.iterdir()):
              if not label_dir.is_dir():
                  continue
              mapping = platform_map.get(label_dir.name)
              copied = []
              for item in sorted(label_dir.rglob("*")):
                  if not item.is_file():
                      continue
                  target_name = item.name
                  if mapping and mapping[2]:
                      if item.name.endswith(".app.tar.gz"):
                          target_name = mapping[2]
                      elif item.name.endswith(".app.tar.gz.sig"):
                          target_name = f"{mapping[2]}.sig"
                  dest = out_dir / target_name
                  shutil.copy2(item, dest)
                  copied.append(dest)

              if mapping:
                  target_key, ext, _ = mapping
                  for asset in copied:
                      if not asset.name.endswith(ext):
                          continue
                      sig_file = Path(f"{asset}.sig")
                      if sig_file.is_file():
                          platforms[target_key] = {
                              "signature": sig_file.read_text(encoding="utf-8").strip(),
                              "url": f"https://github.com/{repo}/releases/download/v{version}/{urllib.parse.quote(asset.name)}",
                          }

          if platforms:
              manifest = {
                  "version": f"v{version}",
                  "notes": f"Orbit v{version}",
                  "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "platforms": platforms,
              }
              (out_dir / "latest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          checksum_lines = []
          for asset in sorted(out_dir.iterdir()):
              if not asset.is_file() or asset.name == "SHA256SUMS.txt":
                  continue
              digest = hashlib.sha256(asset.read_bytes()).hexdigest()
              checksum_lines.append(f"{digest}  {asset.name}")
          (out_dir / "SHA256SUMS.txt").write_text("\n".join(checksum_lines) + "\n", encoding="utf-8")
          EOF
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: Orbit v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          files: release-upload/*
          fail_on_unmatched_files: true
